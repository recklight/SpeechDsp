[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speechdsp"
version = "0.2.0"
description = "Digital signal processing, speech feature extraction and evaluation toolkit."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RL" }]
maintainers = [{ name = "RL" }]
keywords = [
    "signal-processing",
    "speech",
    "mfcc",
    "stft",
    "speech-enhancement",
    "voice-activity-detection",
    "evaluation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.2",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
dl = ["torch>=2.2"]
dev = ["pytest>=7.2", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/recklight/SpeechDsp"
Repository = "https://github.com/recklight/SpeechDsp"
Issues = "https://github.com/recklight/SpeechDsp/issues"
Changelog = "https://github.com/recklight/SpeechDsp/blob/master/CHANGELOG.md"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
speechdsp = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.2"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.ruff.format]
# README 的範例程式碼刻意對齊註解，不交給 formatter 處理
exclude = ["*.md"]
